name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Unit tests for the shared prediction code and the from-scratch learners.
      - run: dotnet test tests/Gavel.Tests -c Release
      # Compile the prediction code to JavaScript with Fable and check it against the .NET answers
      # saved in results/parity.json. (Training needs the Kaggle data, which isn't in the repo.)
      - run: ./scripts/build-js
      - run: node scripts/check-js.mjs
      - run: git diff --exit-code docs/gavel.js || echo "::warning::docs/gavel.js is out of date; run ./scripts/build-js"
